[project]
name = "ai-from-scratch"
version = "0.1.0"
description = "Sân tập tự học AI: cài tay bằng NumPy + playground thử framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pytest>=9.1.1",
    "scikit-learn>=1.7.2",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "fundamentals"]
python_files = ["test_*.py"]
